<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- EDIT: the text in the tab and in search results -->
  <title>Adam Groban</title>
  <meta name="description" content="Adam Groban — personal portfolio." />

  <style>
    :root {
      --bg:     #f6f5f2;
      --ink:    #191a1c;
      --muted:  #57585b;
      --accent: #14615a;
      --line:   #e3e1db;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      padding: 2rem 1.5rem;
    }

    main {
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
      animation: rise 0.7s cubic-bezier(0.2, 0.7, 0.2, 1) both;
    }

    /* Small label above the name */
    .eyebrow {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.72rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 1.1rem;
    }

    h1 {
      font-size: clamp(2.6rem, 9vw, 4.4rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.02;
    }
    /* the accent dot after the name */
    h1 .dot { color: var(--accent); }

    .intro {
      font-size: clamp(1.05rem, 2.6vw, 1.25rem);
      color: var(--muted);
      max-width: 34ch;
      margin-top: 1.4rem;
    }

    /* Row of links */
    nav {
      margin-top: 2.4rem;
      display: flex;
      flex-wrap: wrap;
      gap: 1.5rem;
      padding-top: 1.8rem;
      border-top: 1px solid var(--line);
    }

    nav a {
      color: var(--ink);
      text-decoration: none;
      font-size: 0.95rem;
      position: relative;
      padding-bottom: 2px;
    }
    nav a::after {
      content: "";
      position: absolute;
      left: 0; bottom: 0;
      width: 100%; height: 1.5px;
      background: var(--accent);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.25s ease;
    }
    nav a:hover::after,
    nav a:focus-visible::after { transform: scaleX(1); }

    a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 4px;
      border-radius: 2px;
    }

    footer {
      margin-top: 3.5rem;
      font-size: 0.8rem;
      color: var(--muted);
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      main { animation: none; }
      nav a::after { transition: none; }
    }
  </style>
</head>

<body>
  <main>
    <!-- EDIT: your role, tagline, or just delete this line -->
    <p class="eyebrow">Portfolio</p>

    <!-- EDIT: your name -->
    <h1>Adam Groban<span class="dot">.</span></h1>

    <!-- EDIT: one sentence about who you are and what you do -->
    <p class="intro">A short line about who you are and what you do goes here. Keep it to a sentence or two.</p>

    <!-- EDIT: your links. Change the href values, remove any you don't want, or add more. -->
    <nav>
      <a href="mailto:you@example.com">Email</a>
      <a href="https://github.com/adamgroban">GitHub</a>
      <a href="https://www.linkedin.com/">LinkedIn</a>
    </nav>

    <footer>
      <!-- EDIT: or delete -->
      &copy; 2026 Adam Groban
    </footer>
  </main>
</body>
</html>
